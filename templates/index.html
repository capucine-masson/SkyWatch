<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyWatch — Que voir ce soir dans le ciel ?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Actor&family=Asar&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <aside class="sidebar" aria-label="Historique">
    <span class="sidebar-hint note" aria-hidden="true">historique</span>
    <div class="sidebar-panel">
      <h2>Dernières questions</h2>
      <ul id="history" class="history-list"></ul>
    </div>
  </aside>

  <button id="sky-toggle" class="sky-toggle" type="button" aria-controls="sky-drawer"
          aria-expanded="false" aria-label="Ouvrir la carte du ciel">
    <span class="sky-toggle-label note" aria-hidden="true">carte du ciel</span>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="cst-line" d="M4.5 17 9.5 10.5 15 13.5 19.5 5.5M15 13.5 17.5 19.5"/>
      <circle class="cst-star" style="animation-delay:-.4s" cx="4.5" cy="17" r="1.7"/>
      <circle class="cst-star" style="animation-delay:-1.8s" cx="9.5" cy="10.5" r="1.4"/>
      <circle class="cst-star" style="animation-delay:-1.1s" cx="15" cy="13.5" r="1.9"/>
      <circle class="cst-star" style="animation-delay:-2.4s" cx="19.5" cy="5.5" r="1.5"/>
      <circle class="cst-star" style="animation-delay:-.9s" cx="17.5" cy="19.5" r="1.3"/>
    </svg>
  </button>

  <aside id="sky-drawer" class="sky-drawer" aria-label="Carte du ciel" inert>
    <div class="sky-drawer-inner">
      <header class="sky-head">
        <div>
          <h2>Carte du ciel</h2>
          <p class="note">prochain passage de l'ISS</p>
        </div>
        <button id="sky-close" class="icon-btn" type="button" aria-label="Replier la carte du ciel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 5 7 7-7 7M13 5l7 7-7 7"/></svg>
        </button>
      </header>

      <div class="sky-wrap">
        <svg id="sky" viewBox="0 0 400 400" role="img" aria-label="Carte du ciel : trajectoire de l'ISS"></svg>
      </div>
      <p id="infos" class="infos" role="status"></p>
      <p class="note legend">vue vers le haut : centre = zénith, bord = horizon ·
        trait plein = ISS visible à l'œil nu, pointillés = non visible</p>
      <button id="carte-btn" type="button" class="link">actualiser</button>
    </div>
  </aside>

  <main class="stage">
    <header class="hero">
      <h1>SkyWatch</h1>
      <p class="tagline">Que voir ce soir dans le ciel ?</p>
    </header>

    <div id="messages" class="messages" aria-live="polite"></div>

    <div class="composer-wrap">
      <form id="ask-form" class="composer">
        <input id="question" type="text" maxlength="1000" required autocomplete="off"
               placeholder="Qu'est-ce que je peux observer ce soir depuis chez moi ?">
        <button id="ask-btn" type="submit">Demander</button>
      </form>

      <div class="cityline">
        <label for="ville" class="note">ville</label>
        <input id="ville" type="text" maxlength="100" placeholder="ex. Lyon" value="{{ ville }}" autocomplete="off">
        <button id="save-ville" type="button" class="link">enregistrer</button>
        <span id="ville-status" class="note" role="status"></span>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', path='app.js') }}"></script>
  <script src="{{ url_for('static', path='carte.js') }}"></script>
</body>
</html>
